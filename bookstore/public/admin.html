<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>لوحة الإدارة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="admin">
  <main>
    <h1>لوحة الإدارة</h1>
    <form id="login" class="promo">
      <input id="pass" type="password" placeholder="كلمة مرور الإدارة (ADMIN_PASSWORD)" autocomplete="current-password">
      <button class="btn small">دخول</button>
    </form>
    <p id="loginMsg" class="msg"></p>

    <div id="panel" hidden>
      <p id="paymentsStatus" class="status"></p>
      <p id="storageStatus" class="status" hidden></p>

      <h2>ملفات الكتب</h2>
      <p class="hint" id="booksHint"></p>
      <div class="dl-list" id="books"></div>

      <h2>المبيعات</h2>
      <p id="summary" class="msg"></p>
      <div class="table-wrap"><table id="table"></table></div>
    </div>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
