# Render Blueprint — https://render.com/docs/blueprint-spec
# Free setup: Render free web service + Neon free Postgres (orders) + PDFs inside this PRIVATE repo.
services:
  - type: web
    name: author-bookstore
    runtime: node
    rootDir: bookstore
    plan: free
    region: frankfurt        # closest Render region to Egypt; create the Neon DB in Frankfurt too
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/catalog
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_PROVIDER
        value: paymob
      - key: ALLOW_BOOK_UPLOADS   # free instances have no persistent disk; books come from the repo
        value: "false"
      - key: MAX_DOWNLOADS_PER_BOOK
        value: "10"
      - key: DATABASE_URL         # Neon connection string (postgresql://...?sslmode=require)
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYMOB_SECRET_KEY
        sync: false
      - key: PAYMOB_PUBLIC_KEY
        sync: false
      - key: PAYMOB_HMAC_SECRET
        sync: false
      - key: PAYMOB_INTEGRATION_IDS
        sync: false
