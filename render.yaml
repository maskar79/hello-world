# Render Blueprint — https://render.com/docs/blueprint-spec
# Free setup: Render free web service + Neon free Postgres (orders) + PDFs inside this PRIVATE repo.
services:
  - type: web
    name: author-bookstore
    runtime: node
    rootDir: bookstore
    plan: free
    region: frankfurt        # closest Render region to Egypt; create the Neon DB in Frankfurt too
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/catalog
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_PROVIDER
        value: paymob
      - key: ALLOW_BOOK_UPLOADS   # free instances have no persistent disk; books come from the repo
        value: "false"
      - key: MAX_DOWNLOADS_PER_BOOK
        value: "3"
      - key: DATABASE_URL         # Neon connection string (postgresql://...?sslmode=require)
        sync: false
      # --- order confirmation email (see GO-LIVE.md) ---
      - key: RESEND_API_KEY       # or set BREVO_API_KEY instead; leave empty to send no emails
        sync: false
      - key: MAIL_FROM_EMAIL      # e.g. books@your-domain.com (must be verified with the email service)
        sync: false
      - key: MAIL_FROM_NAME
        value: إسراءيل
      - key: MAIL_REPLY_TO        # customers' replies go here
        value: Goyalla@gmail.com
      - key: CONTACT_WHATSAPP     # shown in the email
        value: "+971 50 617 8653"
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYMOB_SECRET_KEY
        sync: false
      - key: PAYMOB_PUBLIC_KEY
        sync: false
      - key: PAYMOB_HMAC_SECRET
        sync: false
      - key: PAYMOB_INTEGRATION_IDS
        sync: false
